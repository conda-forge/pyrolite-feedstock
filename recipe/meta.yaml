{% set name = "pyrolite" %}
{% set version = "0.3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pyrolite-{{ version }}.tar.gz
  sha256: 3ed94f56f621cf9aa19d2670e31daa5e9106a599ef3734adcfb7aaec9a77a31b

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=80
    - setuptools-scm[simple] >=8
  run:
    - python >={{ python_min }}
    - numpy
    - periodictable
    - matplotlib-base >=3.9
    - mpltern >=0.4.0
    - scipy >=1.2
    - sympy >=1.7
    - pandas >=1.0
    - requests

test:
  requires:
    - python {{ python_min }}
  imports:
    - pyrolite
    - pyrolite.plot

about:
  home: https://github.com/morganjwilliams/pyrolite
  summary: Tools for geochemical data analysis.
  license: MIT
  license_file: LICENSE
  doc_url: https://pyrolite.readthedocs.io/
  dev_url: https://github.com/morganjwilliams/pyrolite

extra:
  recipe-maintainers:
    - morganjwilliams
    - eazzzon
